<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тестовый софтфон оператора</title>
<style>
  :root { --bg:#f6f7f9; --fg:#1d2430; --muted:#5b6574; --card:#fff; --line:#d8dde5; --accent:#2f6fde; --ok:#1f8a4c; --err:#c23b3b; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14181f; --fg:#e6e9ee; --muted:#9aa4b2; --card:#1c222b; --line:#2e3642; --accent:#6c9bf0; --ok:#4cc27e; --err:#ef6a6a; } }
  body { margin:0; font:15px/1.45 system-ui, sans-serif; background:var(--bg); color:var(--fg); }
  main { max-width:560px; margin:24px auto; padding:0 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px 18px; margin-bottom:14px; }
  h1 { font-size:20px; margin:0 0 4px; } p.hint { color:var(--muted); margin:0 0 12px; font-size:13px; }
  label { display:block; font-size:13px; color:var(--muted); margin:10px 0 4px; }
  input { width:100%; box-sizing:border-box; padding:8px 10px; border:1px solid var(--line); border-radius:6px; background:transparent; color:var(--fg); font:inherit; }
  button { padding:8px 14px; border-radius:6px; border:1px solid var(--accent); background:var(--accent); color:#fff; font:inherit; cursor:pointer; margin:12px 8px 0 0; }
  button.secondary { background:transparent; color:var(--accent); }
  button:disabled { opacity:.45; cursor:default; }
  #status { font-weight:600; } .ok { color:var(--ok); } .err { color:var(--err); }
  #log { font:12px/1.4 ui-monospace, monospace; white-space:pre-wrap; max-height:220px; overflow:auto; color:var(--muted); }
</style>
</head>
<body>
<main>
  <div class="card">
    <h1>Тестовый софтфон оператора</h1>
    <p class="hint">Только для стенда pbx-config. Сначала откройте
      <a id="certlink" href="https://192.168.57.10:8443/" target="_blank">https://192.168.57.10:8443/</a>
      и примите самоподписанный сертификат, затем вернитесь сюда.</p>
    <label for="ws">WSS-сервер</label><input id="ws" value="wss://192.168.57.10:8443">
    <label for="uri">SIP-адрес оператора</label><input id="uri" value="sip:1001@bii.pbx.test">
    <label for="pw">Пароль</label><input id="pw" type="password" autocomplete="off">
    <button id="reg">Зарегистрироваться</button><button id="unreg" class="secondary" disabled>Отключиться</button>
  </div>
  <div class="card">
    <div>Состояние: <span id="status">не подключён</span></div>
    <button id="answer" disabled>Ответить</button><button id="hangup" class="secondary" disabled>Положить трубку</button>
    <audio id="remote" autoplay></audio>
  </div>
  <div class="card"><div id="log"></div></div>
</main>
<script src="vendor/jssip-3.13.9.min.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  let ua = null, session = null;
  const log = (m) => { $('log').textContent = new Date().toLocaleTimeString() + '  ' + m + '\n' + $('log').textContent; };
  const status = (m, cls) => { $('status').textContent = m; $('status').className = cls || ''; };

  $('ws').addEventListener('input', () => {
    $('certlink').href = $('certlink').textContent = $('ws').value.replace(/^wss:/, 'https:') + '/';
  });

  $('reg').onclick = () => {
    const socket = new JsSIP.WebSocketInterface($('ws').value.trim());
    ua = new JsSIP.UA({ sockets: [socket], uri: $('uri').value.trim(), password: $('pw').value, register: true, session_timers: false });
    ua.on('connected', () => log('WSS подключён'));
    ua.on('disconnected', () => { status('нет соединения (сертификат принят?)', 'err'); log('WSS отключён'); });
    ua.on('registered', () => { status('зарегистрирован, жду звонок из очереди', 'ok'); log('REGISTER 200 OK'); });
    ua.on('registrationFailed', (e) => { status('ошибка регистрации: ' + e.cause, 'err'); log('регистрация: ' + e.cause); });
    ua.on('newRTCSession', (e) => {
      if (e.originator !== 'remote') return;
      if (session) { e.session.terminate({ status_code: 486 }); return; }
      session = e.session;
      status('входящий звонок от ' + session.remote_identity.uri.user, 'ok');
      log('INVITE от ' + session.remote_identity.uri.toString());
      $('answer').disabled = false; $('hangup').disabled = false;
      session.connection && session.connection.addEventListener('track', (ev) => { $('remote').srcObject = ev.streams[0]; });
      session.on('peerconnection', (pe) => pe.peerconnection.addEventListener('track', (ev) => { $('remote').srcObject = ev.streams[0]; }));
      session.on('confirmed', () => { status('разговор', 'ok'); log('разговор начался'); });
      const done = (ev) => { status('звонок завершён: ' + (ev.cause || ''), ''); log('звонок завершён: ' + (ev.cause || '')); session = null; $('answer').disabled = true; $('hangup').disabled = true; };
      session.on('ended', done); session.on('failed', done);
    });
    ua.start();
    $('reg').disabled = true; $('unreg').disabled = false; status('подключение…');
  };

  $('unreg').onclick = () => { if (ua) ua.stop(); ua = null; $('reg').disabled = false; $('unreg').disabled = true; status('не подключён'); };
  $('answer').onclick = () => { if (session) session.answer({ mediaConstraints: { audio: true, video: false } }); $('answer').disabled = true; };
  $('hangup').onclick = () => { if (session) session.terminate(); };
</script>
</body>
</html>

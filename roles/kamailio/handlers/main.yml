---
- name: Restart kamailio
  ansible.builtin.systemd_service:
    name: kamailio
    state: restarted
  tags: [systemd]

# Списки перечитываются без перезапуска. Если Kamailio ещё не запущен,
# он прочитает новые файлы при старте.
- name: Reload kamailio dispatcher
  ansible.builtin.shell: |
    if systemctl is-active --quiet kamailio; then kamcmd dispatcher.reload; fi
  changed_when: true

- name: Reload kamailio addresses
  ansible.builtin.shell: |
    if systemctl is-active --quiet kamailio; then kamcmd permissions.addressReload; fi
  changed_when: true

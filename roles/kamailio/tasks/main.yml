---
- name: Репозиторий Kamailio {{ kamailio_version }}
  ansible.builtin.yum_repository:
    name: "kamailio-{{ kamailio_version }}"
    description: "Kamailio {{ kamailio_version }} (rpm.kamailio.org)"
    baseurl: "{{ kamailio_repo_baseurl }}"
    gpgcheck: true
    gpgkey: https://rpm.kamailio.org/rpm-pub.key
    enabled: true

- name: Пакеты Kamailio
  ansible.builtin.dnf:
    name: "{{ kamailio_packages }}"
    state: present

- name: Каталог drop-in systemd для Kamailio
  ansible.builtin.file:
    path: /etc/systemd/system/kamailio.service.d
    state: directory
    mode: "0755"

- name: Kamailio стартует после rtpengine
  ansible.builtin.copy:
    dest: /etc/systemd/system/kamailio.service.d/10-rtpengine.conf
    content: |
      # Управляется Ansible: roles/kamailio
      # Иначе модуль rtpengine Kamailio при загрузке не дождётся rtpengine
      # и на время rtpengine_disable_tout будет отклонять звонки.
      [Unit]
      Wants=rtpengine.service
      After=rtpengine.service
    mode: "0644"
  notify: Restart kamailio

- name: Обёртка запуска (старт без БД)
  ansible.builtin.template:
    src: pbx-kamailio-start.j2
    dest: /usr/local/libexec/pbx-kamailio-start
    mode: "0755"
  notify: Restart kamailio

- name: Kamailio запускается через обёртку
  ansible.builtin.copy:
    dest: /etc/systemd/system/kamailio.service.d/20-pbx-start.conf
    content: |
      # Управляется Ansible: roles/kamailio
      # Если PostgreSQL недоступен, SBC всё равно стартует (NO_LOCATION_DB).
      [Service]
      ExecStart=
      ExecStart=/usr/local/libexec/pbx-kamailio-start --atexit=no -DD -P /run/kamailio/kamailio.pid -f $CFGFILE -m $SHM_MEMORY -M $PKG_MEMORY
    mode: "0644"
  notify: Restart kamailio

- name: Память Kamailio
  ansible.builtin.template:
    src: kamailio.sysconfig.j2
    dest: /etc/sysconfig/kamailio
    mode: "0644"
  notify: Restart kamailio

- name: Каталог сертификатов TLS
  ansible.builtin.file:
    path: /etc/kamailio/tls
    state: directory
    owner: root
    group: kamailio
    mode: "0750"

- name: Самоподписанный сертификат для WSS (стенд)
  ansible.builtin.command:
    cmd: >-
      openssl req -x509 -newkey rsa:2048 -nodes -days 825
      -keyout /etc/kamailio/tls/sbc.key -out /etc/kamailio/tls/sbc.crt
      -subj "/CN={{ core_ip }}" -addext "subjectAltName=IP:{{ core_ip }}"
    creates: /etc/kamailio/tls/sbc.crt
  when: kamailio_tls_selfsigned | bool
  notify: Restart kamailio

- name: Сертификат для WSS из Vault (прод)
  ansible.builtin.copy:
    content: "{{ item.content }}"
    dest: "/etc/kamailio/tls/{{ item.name }}"
    owner: root
    group: kamailio
    mode: "0640"
  loop:
    - name: sbc.crt
      content: "{{ vault_kamailio_tls_cert | default('') }}"
    - name: sbc.key
      content: "{{ vault_kamailio_tls_key | default('') }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true
  when: not kamailio_tls_selfsigned | bool
  notify: Restart kamailio

- name: Права на ключ TLS
  ansible.builtin.file:
    path: /etc/kamailio/tls/sbc.key
    owner: root
    group: kamailio
    mode: "0640"

- name: Настройки TLS
  ansible.builtin.template:
    src: tls.cfg.j2
    dest: /etc/kamailio/tls.cfg
    owner: root
    group: kamailio
    mode: "0640"
  notify: Restart kamailio

- name: Наборы dispatcher (пары Asterisk тенантов)
  ansible.builtin.template:
    src: dispatcher.list.j2
    dest: /etc/kamailio/dispatcher.list
    mode: "0644"
  notify: Reload kamailio dispatcher

- name: Доверенные адреса (провайдеры, Asterisk)
  ansible.builtin.template:
    src: address.list.j2
    dest: /etc/kamailio/address.list
    mode: "0644"
  notify: Reload kamailio addresses

- name: Принадлежность DID тенантам и маршруты операторов
  ansible.builtin.template:
    src: tenants.cfg.j2
    dest: /etc/kamailio/tenants.cfg
    mode: "0644"
  notify: Restart kamailio

- name: Строки подключения к БД (пароли)
  ansible.builtin.template:
    src: secrets.cfg.j2
    dest: /etc/kamailio/secrets.cfg
    owner: root
    group: kamailio
    mode: "0640"
  no_log: true
  notify: Restart kamailio

- name: Основная конфигурация (с проверкой kamailio -c)
  ansible.builtin.template:
    src: kamailio.cfg.j2
    dest: /etc/kamailio/kamailio.cfg
    owner: root
    group: kamailio
    mode: "0640"
    validate: kamailio -c -f %s
  notify: Restart kamailio

- name: SIP в firewalld
  ansible.posix.firewalld:
    zone: "{{ item }}"
    port: 5060/udp
    state: enabled
    permanent: true
    immediate: true
  loop: [voice-edge, voice-core]
  when: kamailio_firewall_manage | bool
  tags: [firewall]

- name: WSS операторов в firewalld (только voice-core)
  ansible.posix.firewalld:
    zone: voice-core
    port: "{{ kamailio_wss_port }}/tcp"
    state: enabled
    permanent: true
    immediate: true
  when: kamailio_firewall_manage | bool
  tags: [firewall]

- name: Запустить Kamailio
  ansible.builtin.systemd_service:
    name: kamailio
    state: started
    enabled: true
    daemon_reload: true
  tags: [systemd]

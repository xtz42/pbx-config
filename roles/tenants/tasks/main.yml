---
# Результат: факт tenants_all — словарь {код: описание} всех тенантов,
# и tenants_current — описание тенанта текущего хоста (если задана переменная tenant).

- name: Найти описания тенантов
  ansible.builtin.set_fact:
    _tenants_files: "{{ query('ansible.builtin.fileglob', tenants_dir ~ '/*.yml') | reject('search', '/_[^/]*$') | sort }}"

- name: Загрузить описания тенантов
  ansible.builtin.set_fact:
    tenants_all: "{{ tenants_all | default({}) | combine({_t.code: _t}) }}"
  vars:
    _t: "{{ (lookup('ansible.builtin.file', item) | from_yaml).tenant }}"
  loop: "{{ _tenants_files }}"
  loop_control:
    label: "{{ item | basename }}"

- name: Проверить каждый тенант
  ansible.builtin.assert:
    that:
      - item | basename == _t.code ~ '.yml'
      - _t.code is match('^[a-z0-9]{2,8}$')
      - _t.sbc.dispatcher_setid | int > 0
      - _t.sbc.dids | length > 0
      - _t.languages | length > 0
      - _t.db.name == _t.code
      - _t.operators.sip_domain | length > 0
    fail_msg: "Некорректное описание тенанта {{ item }} (см. tenants/_template.yml)"
    quiet: true
  vars:
    _t: "{{ (lookup('ansible.builtin.file', item) | from_yaml).tenant }}"
  loop: "{{ _tenants_files }}"
  loop_control:
    label: "{{ item | basename }}"

- name: Проверить уникальность наборов dispatcher, DID и доменов операторов
  ansible.builtin.assert:
    that:
      - _setids | length == _setids | unique | length
      - _dids | length == _dids | unique | length
      - _domains | length == _domains | unique | length
    fail_msg: "Повторяются dispatcher_setid, DID или sip_domain у разных тенантов"
    quiet: true
  vars:
    _setids: "{{ tenants_all.values() | map(attribute='sbc') | map(attribute='dispatcher_setid') | list }}"
    _dids: "{{ tenants_all.values() | map(attribute='sbc') | map(attribute='dids') | flatten }}"
    _domains: "{{ tenants_all.values() | map(attribute='operators') | map(attribute='sip_domain') | list }}"

- name: Проверить, что тенант хоста описан
  ansible.builtin.assert:
    that: tenant in tenants_all
    fail_msg: "Для хоста {{ inventory_hostname }} задан tenant={{ tenant }}, но нет tenants/{{ tenant }}.yml"
    quiet: true
  when: tenant is defined

- name: Тенант текущего хоста
  ansible.builtin.set_fact:
    tenants_current: "{{ tenants_all[tenant] }}"
  when: tenant is defined

---
- name: Пакет Asterisk
  ansible.builtin.include_role:
    name: rpm_package
  vars:
    rpm_package_name: asterisk
    rpm_package_spec: rpm/asterisk.spec
    rpm_package_local_sources:
      - rpm/asterisk.service
    rpm_package_remote_sources: "{{ asterisk_sources }}"

- name: ODBC для PostgreSQL
  ansible.builtin.dnf:
    name: [unixODBC, postgresql-odbc]
    state: present

- name: Источник данных ODBC
  ansible.builtin.template:
    src: odbc.ini.j2
    dest: /etc/odbc.ini
    owner: root
    group: root
    mode: "0644"
  notify: Restart asterisk

- name: Каталог диалплана
  ansible.builtin.file:
    path: /etc/asterisk/extensions.d
    state: directory
    owner: root
    group: asterisk
    mode: "0750"

- name: Конфигурация Asterisk
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/asterisk/{{ item }}"
    owner: root
    group: asterisk
    mode: "0640"
  loop: "{{ asterisk_config_files }}"
  notify: Restart asterisk

- name: Подключение к базе тенанта (пароль)
  ansible.builtin.template:
    src: res_odbc.conf.j2
    dest: /etc/asterisk/res_odbc.conf
    owner: root
    group: asterisk
    mode: "0640"
  no_log: true
  notify: Restart asterisk

- name: Диалплан
  ansible.builtin.template:
    src: "extensions.d/{{ item }}.j2"
    dest: "/etc/asterisk/extensions.d/{{ item }}"
    owner: root
    group: asterisk
    mode: "0640"
  loop: "{{ asterisk_dialplan_files + (['tenant-' ~ tenants_current.code ~ '.conf'] if tenants_current.dialplan.custom else []) }}"
  notify: Reload asterisk

- name: SIP и RTP в firewalld (только voice-core)
  ansible.posix.firewalld:
    zone: voice-core
    port: "{{ item }}"
    state: enabled
    permanent: true
    immediate: true
  loop:
    - 5060/udp
    - "{{ asterisk_rtp_start }}-{{ asterisk_rtp_end }}/udp"
  when: asterisk_firewall_manage | bool
  tags: [firewall]

- name: Запустить Asterisk
  ansible.builtin.systemd_service:
    name: asterisk
    state: started
    enabled: true
  tags: [systemd]

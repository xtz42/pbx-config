---
# Инвентарь Vagrant-стенда (vagrant/Vagrantfile). Адреса синтетические:
#   192.168.56.0/24 — voice-edge (провайдер, хост с софтфоном = 192.168.56.1)
#   192.168.57.0/24 — voice-core (SBC ↔ Asterisk ↔ PostgreSQL)
# Каждая ВМ провижинит сама себя (ansible_local, --limit <имя ВМ>).
all:
  children:
    sbc:
      hosts:
        sbc:
          edge_ip: 192.168.56.10
          core_ip: 192.168.57.10
    pbx:
      hosts:
        pbx-bii-1:
          tenant: bii
          core_ip: 192.168.57.21
    db:
      hosts: {}
    # Принадлежность к ЦОД задаёт приоритет в dispatcher (group_vars/dc*.yml).
    dc1:
      hosts:
        sbc:
        pbx-bii-1:
    dc2:
      hosts: {}
